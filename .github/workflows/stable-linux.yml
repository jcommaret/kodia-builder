name: stable-linux

on:
  workflow_call:
    inputs:
      BUILD_SOURCEVERSION:
        required: true
        type: string
      MS_COMMIT:
        required: true
        type: string
      MS_TAG:
        required: true
        type: string
      RELEASE_VERSION:
        required: true
        type: string
      RELEASE_TITLE:
        required: true
        type: string
      VOID_VERSION:
        required: true
        type: string
      SHOULD_BUILD:
        required: true
        type: string
      SHOULD_DEPLOY:
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: Kodia
  ASSETS_REPOSITORY: jcommaret/kodia
  BINARY_NAME: kodia
  DISABLE_UPDATE: 'no'
  GH_REPO_PATH: jcommaret/kodia
  ORG_NAME: jcommaret
  VERSIONS_REPOSITORY: jcommaret/kodia
  VSCODE_QUALITY: stable

jobs:
  build_linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: X64
            vscode_arch: x64
            npm_arch: x64
            runner: ubuntu-24.04
          # cross-compiled on x64 with VS Code's glibc 2.28 sysroot, like VS Code does: its toolchain only runs on x64,
          # and building on the arm64 runner linked the native modules and the CLI against Ubuntu 24.04's glibc 2.39
          - slug: ARM64
            vscode_arch: arm64
            npm_arch: arm64
            runner: ubuntu-24.04
    env:
      BUILD_SOURCEVERSION: ${{ inputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_LINUX_APP_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ inputs.MS_COMMIT }}
      MS_TAG: ${{ inputs.MS_TAG }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      RELEASE_TITLE: ${{ inputs.RELEASE_TITLE }}
      VOID_VERSION: ${{ inputs.VOID_VERSION }}
      SHOULD_BUILD: ${{ inputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ inputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      OS_NAME: linux
      VOID_BUILDER_ROOT: ${{ github.workspace }}
      SHOULD_BUILD_DEB: 'yes'
      SHOULD_BUILD_RPM: 'yes'
      # its update info still points to Void's repository (build/linux/appimage/build.sh)
      SHOULD_BUILD_APPIMAGE: 'no'

    steps:
      - uses: actions/checkout@v7
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Checkout builder PR
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./ci_repo.sh pr
        if: env.DISABLED != 'yes'

      - name: Platform CI setup
        env:
          CHECK_REH: 'no'
          DISABLE_APPIMAGE: ${{ vars.DISABLE_STABLE_APPIMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci_platform.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Pin npm version
        run: npm install -g "npm@<11.2.0"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install dependencies
        run: ./build/linux/deps.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install missing dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libpango-1.0-0 libudev1 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxkbfile1 libxrandr2 xdg-utils zlib1g
          # to build the .deb (dpkg-deb, dpkg-shlibdeps, fakeroot) and the .rpm (rpmbuild)
          sudo apt-get install -y dpkg-dev fakeroot rpm
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Son cache vise la racine du dépôt, sans Cargo.lock : celui du CLI est mis en place plus bas
          cache: false
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Download vscode artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Extract vscode artifact
        run: tar -xzf vscode.tar.gz && rm vscode.tar.gz
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # Même clé que le pipeline de VS Code (computeNodeModulesCacheKey.ts) ; le hashFiles de la clé ajoute les scripts du builder qui changent l'installation
      - name: Compute node_modules cache key
        id: nm-key
        run: |
          cd vscode
          echo "key=$( node build/azure-pipelines/common/computeNodeModulesCacheKey.ts linux "${VSCODE_ARCH}" "$( node -p process.arch )" "$( node -v )" )" >> "${GITHUB_OUTPUT}"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: vscode/.build/node_modules_cache
          key: node_modules-linux-${{ matrix.vscode_arch }}-${{ steps.nm-key.outputs.key }}-${{ hashFiles('build/linux/package_bin.sh', 'patches/linux/**', 'build/linux/*/electron.sh', 'npmrc') }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Extract node_modules cache
        run: tar -xzf vscode/.build/node_modules_cache/cache.tgz -C vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && steps.nm-cache.outputs.cache-hit == 'true'

      - name: Cache the CLI build (Rust)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vscode/cli -> target
          key: ${{ matrix.vscode_arch }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
          NODE_MODULES_RESTORED: ${{ steps.nm-cache.outputs.cache-hit }}
        run: ./build/linux/package_bin.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # Sauvegardé même si une étape suivante échoue : l'archive est créée juste après npm ci (scripts/lib/node_modules_cache.sh)
      - name: Save node_modules cache
        uses: actions/cache/save@v6
        with:
          path: vscode/.build/node_modules_cache
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}
        if: "!cancelled() && env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && steps.nm-cache.outputs.cache-hit != 'true' && hashFiles('vscode/.build/node_modules_cache/cache.tgz') != ''"

      - name: Prepare assets
        env:
          # Le .deb/.rpm télécharge le sysroot via l'API GitHub : sans token, le quota anonyme partagé des runners renvoie 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          # .deb and .rpm are back: dpkg-shlibdeps failed on sharp, which the app no longer ships since VS Code 1.141
          SHOULD_BUILD_DEB: 'yes'
          SHOULD_BUILD_RPM: 'yes'
          SHOULD_BUILD_APPIMAGE: 'no'
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Upload to GitHub release
        env:
          STRONGER_GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN != '' && secrets.STRONGER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Prepare the update manifests (Linux)
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          MANIFESTS_DIR: manifests
        run: |
          ./update_version.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      # publish_release.sh commits the manifests once the release is published (see update_version.sh's MANIFESTS_DIR)
      - name: Hand the update manifests to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: manifests-linux-${{ matrix.vscode_arch }}
          path: manifests/
          if-no-files-found: error
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: void-linux-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
