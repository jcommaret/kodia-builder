name: stable-windows

on:
  workflow_call:
    inputs:
      BUILD_SOURCEVERSION:
        required: true
        type: string
      MS_COMMIT:
        required: true
        type: string
      MS_TAG:
        required: true
        type: string
      RELEASE_VERSION:
        required: true
        type: string
      RELEASE_TITLE:
        required: true
        type: string
      VOID_VERSION:
        required: true
        type: string
      SHOULD_BUILD:
        required: true
        type: string
      SHOULD_DEPLOY:
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: Kodia
  ASSETS_REPOSITORY: jcommaret/kodia
  BINARY_NAME: kodia
  DISABLE_UPDATE: 'no'
  GH_REPO_PATH: jcommaret/kodia
  ORG_NAME: jcommaret
  VERSIONS_REPOSITORY: jcommaret/kodia
  VSCODE_QUALITY: stable

jobs:
  build_windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: X64
            vscode_arch: x64
            npm_arch: x64
          - slug: ARM64
            vscode_arch: arm64
            npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ inputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_WINDOWS_APP_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ inputs.MS_COMMIT }}
      MS_TAG: ${{ inputs.MS_TAG }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      RELEASE_TITLE: ${{ inputs.RELEASE_TITLE }}
      VOID_VERSION: ${{ inputs.VOID_VERSION }}
      SHOULD_BUILD: ${{ inputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ inputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      OS_NAME: windows
      npm_config_msvs_version: '2022'
      VOID_BUILDER_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Checkout builder PR
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./ci_repo.sh pr
        if: env.DISABLED != 'yes'

      - name: Platform CI setup
        shell: bash
        env:
          CHECK_REH: 'no'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci_platform.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Download vscode artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vscode_arch == 'arm64' && 'amd64_arm64' || 'x64' }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Pin npm version
        run: npm install -g "npm@<11.2.0"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Extract vscode artifact
        shell: bash
        run: tar -xzf vscode.tar.gz && rm vscode.tar.gz
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # Même clé que le pipeline de VS Code (computeNodeModulesCacheKey.ts) ; le hashFiles de la clé ajoute les scripts du builder qui changent l'installation
      - name: Compute node_modules cache key
        id: nm-key
        shell: bash
        run: |
          cd vscode
          echo "key=$( node build/azure-pipelines/common/computeNodeModulesCacheKey.ts windows "${VSCODE_ARCH}" "$( node -p process.arch )" "$( node -v )" )" >> "${GITHUB_OUTPUT}"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache/restore@v6
        with:
          path: vscode/.build/node_modules_cache
          key: node_modules-windows-${{ matrix.vscode_arch }}-${{ steps.nm-key.outputs.key }}-${{ hashFiles('build/windows/package.sh', 'npmrc') }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Extract node_modules cache
        shell: bash
        run: tar -xzf vscode/.build/node_modules_cache/cache.tgz -C vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && steps.nm-cache.outputs.cache-hit == 'true'

      - name: Cache the CLI build (Rust)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vscode/cli -> target
          key: ${{ matrix.vscode_arch }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
          NODE_MODULES_RESTORED: ${{ steps.nm-cache.outputs.cache-hit }}
          # Le REH Windows n'est pas publié (prepare_assets.sh le désactive aussi) : inutile de le construire
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./build/windows/package.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # Sauvegardé même si une étape suivante échoue : l'archive est créée juste après npm ci (scripts/lib/node_modules_cache.sh)
      - name: Save node_modules cache
        uses: actions/cache/save@v6
        with:
          path: vscode/.build/node_modules_cache
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}
        if: "!cancelled() && env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && steps.nm-cache.outputs.cache-hit != 'true' && hashFiles('vscode/.build/node_modules_cache/cache.tgz') != ''"

      - name: Prepare assets
        shell: bash
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: List assets before release
        shell: bash
        run: ls -la assets/ || echo "assets/ missing"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Upload to GitHub release
        shell: bash
        env:
          STRONGER_GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN != '' && secrets.STRONGER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Prepare the update manifests (Windows)
        shell: bash
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          MANIFESTS_DIR: manifests
          VOID_BUILDER_ROOT: ${{ github.workspace }}
        run: |
          ls -la assets/ || true
          ./update_version.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      # publish_release.sh commits the manifests once the release is published (see update_version.sh's MANIFESTS_DIR)
      - name: Hand the update manifests to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: manifests-windows-${{ matrix.vscode_arch }}
          path: manifests/
          if-no-files-found: error
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: void-windows-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
